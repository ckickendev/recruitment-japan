<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <path d="M 0,210 L 1200,210 M 0,420 L 1200,420 M 300,0 L 300,630 M 600,0 L 600,630 M 900,0 L 900,630" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Logo Emblem -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="90" height="90" rx="24" fill="url(#accent)"/>
    <!-- Globe/Torii gate motif -->
    <circle cx="45" cy="45" r="28" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <ellipse cx="45" cy="45" rx="14" ry="28" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="17" y1="45" x2="73" y2="45" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Brand Typography -->
  <text x="215" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="1">
    GLOBAL <tspan fill="#f43f5e">CAREER GATE</tspan>
  </text>
  <text x="218" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="3">
    CỔNG CƠ HỘI VIỆC LÀM &amp; KỸ SƯ NHẬT BẢN
  </text>

  <!-- Hero Catchphrase -->
  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" fill="#ffffff">
    Kết Nối Sự Nghiệp Quốc Tế
  </text>
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#f43f5e">
    Cơ Hội Việc Làm Uy Tín Tại Nhật Bản
  </text>

  <text x="100" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#94a3b8">
    Kỹ sư IT • Kỹ sư Cơ khí • Xây dựng • Kỹ năng đặc định (Tokutei Gino)
  </text>

  <!-- Bottom Badges -->
  <g transform="translate(100, 500)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#38bdf8">
      ✓ 100% Pháp Lý Minh Bạch
    </text>

    <!-- Pill 2 -->
    <rect x="280" y="0" width="250" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#34d399">
      ✓ Hotline: 0987.654.321
    </text>

    <!-- Domain -->
    <text x="750" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#f8fafc">
      globalcareergate.com
    </text>
  </g>
</svg>
